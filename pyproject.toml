[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paid-to-disagree"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["datasets>=2.18", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["matplotlib>=3.7"]   # figures in analysis/paper_tables.py (tables work without it)
# GPU-only (Kaggle/Colab): vllm, trl, unsloth, peft. Install there, not on Windows.

[tool.setuptools.packages.find]
include = ["data*", "council*", "rewards*", "train*", "eval*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
