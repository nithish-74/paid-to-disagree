# Ablation 7: council of 4 = the main three + SmolLM2-1.7B-Instruct (a 4th family, ungated,
# Apache-2.0, runs on vLLM in fp16). Project choice of the 4th model; swap it here if wanted.
generation:
  temperature: 0.0
  max_tokens: 256
  seed: 0
  token_prob_fallback: true
  always_option_probs: false
members:
- name: qwen
  backend:
    model: Qwen/Qwen2.5-1.5B-Instruct
    dtype: half
    gpu_memory_utilization: 0.85
    max_model_len: 2048
- name: llama
  backend:
    model: meta-llama/Llama-3.2-1B-Instruct
    dtype: half
    gpu_memory_utilization: 0.85
    max_model_len: 2048
- name: gemma
  backend:
    kind: transformers
    model: google/gemma-3-1b-it
    dtype: float32
    batch_size: 32
    device: last
- name: smollm
  backend:
    model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    dtype: half
    gpu_memory_utilization: 0.85
    max_model_len: 2048
