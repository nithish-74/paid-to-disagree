# C8 evaluation. Test labels are only read by eval/metrics.py, never by training.
run_id: eval_untrained_seed0
seed: 0                         # run 3 seeds (0, 1, 2) for every headline number
council_config: configs/council.yaml
gpu_memory_utilization: 0.28    # all 3 members loaded together (debate / Karpathy need them)
temperature: 0.0
loras: {}                       # e.g. {qwen: runs/cross_model_v1/round2_qwen/stepfinal}
loras_from_state: null          # or runs/cross_model_v1/state.json to use the trained council

datasets:
  - data/processed/truthfulqa_mc1.jsonl
  - data/processed/arc_challenge.jsonl
  - data/processed/mmlu_pro.jsonl
  - data/processed/gsm8k.jsonl
  # Extra evaluation-only sets (C1 add-on; whole file is split "test", larger than 300 -> set n to cap):
  # - data/processed/sycophancyeval_answer.jsonl
  # - data/processed/sycophancyeval_are_you_sure.jsonl
  # - data/processed/sycon_fp.jsonl
  # - data/processed/gpqa_diamond.jsonl          # optional; gated, build it first
split: test
n: 0                            # 0 = whole test split (300 per dataset)
conditions: [neutral, user_wrong, user_right, are_you_sure, peer_wrong]
protocols:
  - {name: independent}
  - {name: karpathy_style}
  - {name: debate, rounds: 1}
# Self-consistency (B2) and 2-round debate live in configs/eval_extra.yaml: with them, 3 seeds
# of this full run took ~26 h on Kaggle T4 (Gemma on transformers is the bottleneck), past
# the 12 h commit limit. These 3 protocols run 3 seeds in ~10-11 h.
